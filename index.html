<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>체육교사 보조 프로그램</title>
<link rel="manifest" href="manifest.webmanifest" id="webManifest">
<meta name="theme-color" content="#14A085">
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="체육 기록장">
<script>(function(){try{if(/[?&]page=teacher/.test(location.search))document.getElementById("webManifest").href="manifest-teacher.webmanifest";}catch(e){}})();</script>
<style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#F2FAF7;color:#557069;font:15px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}</style></head>
<body><div>불러오는 중…</div>
<script>
(function () {
  var q = location.search.replace(/^\?/, ''), done = false;
  function go(v) { if (done) return; done = true; location.replace('app.html?v=' + encodeURIComponent(v || '3.3.6') + (q ? '&' + q : '')); }
  setTimeout(function () { go(''); }, 4000);   // 판 확인이 늦으면 그냥 열기
  fetch('ready.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { go(j.version); }, function () { go(''); });
})();
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
</script></body></html>
